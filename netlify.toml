# Netlify reads this file. Only the "site" folder is published.
[build]
  publish = "site"

# The site's own address is adistrug.co.il. Send the old Netlify address there.
# (Deploy previews use other addresses and are not affected.)
[[redirects]]
  from = "https://adistrug.netlify.app/*"
  to = "https://adistrug.co.il/:splat"
  status = 301
  force = true
